<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#2f5f45" />
<title>OSCEガチャ</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="favicon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" />
<style>
  :root {
    --bg: #eaf1ec;
    --card: #f4faf5;
    --white: #ffffff;
    --ink: #24352b;
    --text-sub: #6b7a70;
    --green: #5fa97f;
    --green-dark: #4d9169;
    --green-deep: #2f5f45;
    --green-pale: #eaf4ee;
    --green-pale2: #d9efe0;
    --border: #dbe8e0;
    --font: 'Zen Maru Gothic', 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); font-family: var(--font); color: var(--ink); min-height: 100vh; }
  a { color: var(--green-deep); }

  @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes popIn { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }

  .page { min-height: 100vh; padding: 24px 16px 48px; display: flex; justify-content: center; box-sizing: border-box; }
  .shell {
    width: 100%; max-width: 720px; background: var(--card); border-radius: 24px; overflow: hidden;
    color: var(--ink); box-shadow: 0 10px 34px rgba(36,53,43,.10); height: fit-content;
  }

  .shell-header {
    padding: 26px 26px 22px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; background: var(--white);
  }
  .shell-header .badge {
    width: 52px; height: 52px; border-radius: 50%; background: var(--green-pale2);
    display: flex; align-items: center; justify-content: center; font-size: 25px; flex: none;
  }
  .shell-header .titles { flex: 1 1 200px; }
  .shell-header .titles .t { font-size: 22px; font-weight: 700; letter-spacing: .02em; }
  .shell-header .titles .s { font-size: 12.5px; color: var(--text-sub); margin-top: 3px; }

  .screen { padding: 22px 22px 30px; display: flex; flex-direction: column; gap: 22px; }

  /* ── 選択画面：出題数・タイマー設定 ── */
  .settings-card { background: var(--white); border-radius: 18px; padding: 20px; display: flex; flex-wrap: wrap; gap: 24px; }
  .settings-label { font-size: 12.5px; color: var(--text-sub); margin-bottom: 8px; }
  .count-row { display: flex; align-items: center; gap: 10px; }
  .stepper-btn {
    width: 44px; height: 44px; border-radius: 14px; border: 0; background: var(--green-pale);
    color: var(--green-deep); font-size: 19px; font-family: inherit; cursor: pointer;
  }
  .stepper-btn:hover { background: var(--green-pale2); }
  .count-input {
    width: 78px; height: 44px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--white);
    color: var(--ink); text-align: center; font-family: inherit; font-size: 17px; font-weight: 700;
  }
  .count-input::placeholder { color: var(--text-sub); font-weight: 500; }
  .link-btn { border: 0; background: transparent; color: var(--green-dark); font-family: inherit; font-size: 12.5px; cursor: pointer; padding: 6px; }
  .link-btn:hover { color: var(--ink); }

  .pill-row { display: flex; gap: 8px; }
  .pill-btn {
    padding: 12px 20px; border-radius: 999px; border: 0; font-family: inherit; font-weight: 700; font-size: 13.5px; cursor: pointer;
    background: var(--green-pale); color: var(--green-deep);
  }
  .pill-btn.active { background: var(--green); color: #fff; }

  .category-label { font-size: 12.5px; color: var(--text-sub); margin-bottom: 10px; }
  .category-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .category-btn {
    border: 0; background: var(--white); border-radius: 18px; text-align: left; cursor: pointer; padding: 18px;
    display: flex; align-items: center; gap: 14px; font-family: inherit; color: var(--ink);
    box-shadow: 0 2px 10px rgba(36,53,43,.06); opacity: 0; animation: fadeInUp .4s cubic-bezier(.2,.8,.2,1) both;
  }
  .category-btn:hover { background: var(--green-pale); box-shadow: 0 8px 22px rgba(36,53,43,.12); }
  .category-btn:active { background: var(--green-pale2); }
  .category-btn .emoji { width: 44px; height: 44px; flex: none; border-radius: 50%; background: var(--green-pale); display: flex; align-items: center; justify-content: center; font-size: 21px; }
  .category-btn .info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .category-btn .name { font-size: 17px; font-weight: 700; }
  .category-btn .meta { font-size: 11.5px; color: var(--text-sub); }

  /* ── 結果画面 ── */
  .result-header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .tag { background: var(--green); color: #fff; font-size: 13px; font-weight: 700; padding: 7px 16px; border-radius: 999px; animation: popIn .35s cubic-bezier(.34,1.56,.64,1) both; }
  .tag.sub { background: var(--green-pale2); color: var(--green-deep); }
  .count-label { margin-left: auto; font-size: 12px; color: var(--text-sub); }

  .timer-card { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: var(--white); border-radius: 18px; padding: 16px 20px; box-shadow: 0 2px 10px rgba(36,53,43,.06); }
  .clock { font-size: 36px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; color: var(--ink); }
  .clock-label { font-size: 12px; color: var(--text-sub); }
  .timer-actions { margin-left: auto; display: flex; gap: 8px; }
  .run-btn { padding: 13px 22px; border-radius: 999px; border: 0; background: var(--green); color: #fff; font-family: inherit; font-weight: 700; font-size: 13.5px; cursor: pointer; }
  .run-btn:hover { background: var(--green-dark); }
  .reset-btn { padding: 13px 22px; border-radius: 999px; border: 0; background: var(--green-pale); color: var(--green-deep); font-family: inherit; font-weight: 700; font-size: 13.5px; cursor: pointer; }
  .reset-btn:hover { background: var(--green-pale2); }

  .item-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .item-list li {
    display: flex; align-items: center; gap: 14px; background: var(--white); border-radius: 16px; padding: 15px 18px;
    box-shadow: 0 2px 10px rgba(36,53,43,.06); opacity: 0; animation: fadeInUp .4s cubic-bezier(.2,.8,.2,1) both;
  }
  .item-list li .num { width: 28px; height: 28px; flex: none; border-radius: 50%; background: var(--green-pale2); color: var(--green-deep); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .item-list li .text { font-size: 15.5px; font-weight: 500; text-wrap: pretty; }

  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .action-btn { flex: 1 1 160px; padding: 15px 20px; border-radius: 999px; border: 0; font-family: inherit; font-weight: 700; font-size: 14.5px; cursor: pointer; }
  .action-primary { background: var(--green); color: #fff; }
  .action-primary:hover { background: var(--green-dark); }
  .action-secondary { background: var(--white); color: var(--green-deep); border: 1.5px solid var(--border); }
  .action-secondary:hover { background: var(--green-pale); }

  .hidden { display: none !important; }

  @media (min-width: 760px) {
    .page { align-items: center; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="shell">
    <div class="shell-header">
      <div class="badge">🩺</div>
      <div class="titles">
        <div class="t">OSCEガチャ</div>
        <div class="s">カテゴリを選ぶと、出題項目をランダムに表示します</div>
      </div>
    </div>

    <section class="screen" id="screen-select">
      <div class="settings-card">
        <div>
          <div class="settings-label">出題数</div>
          <div class="count-row">
            <button class="stepper-btn" id="btn-dec">−</button>
            <input type="number" min="1" max="40" placeholder="推奨" id="count-input" class="count-input" />
            <button class="stepper-btn" id="btn-inc">＋</button>
            <button class="link-btn" id="btn-reset-count">推奨に戻す</button>
          </div>
        </div>
        <div>
          <div class="settings-label">タイマー</div>
          <div class="pill-row">
            <button class="pill-btn" id="btn-timer-on">本番想定</button>
            <button class="pill-btn" id="btn-timer-off">なし</button>
          </div>
        </div>
      </div>

      <div>
        <div class="category-label">カテゴリを選んでください</div>
        <div class="category-grid" id="category-grid"></div>
      </div>
    </section>

    <section class="screen hidden" id="screen-result">
      <div class="result-header" id="result-header"></div>
      <div class="timer-card hidden" id="timer-card">
        <span class="clock" id="clock">00:00</span>
        <span class="clock-label">経過時間</span>
        <div class="timer-actions">
          <button class="run-btn" id="btn-toggle-run">開始</button>
          <button class="reset-btn" id="btn-reset-clock">リセット</button>
        </div>
      </div>
      <ol class="item-list" id="item-list"></ol>
      <div class="btn-row">
        <button class="action-btn action-primary" id="btn-redraw">もう一度抽選</button>
        <button class="action-btn action-secondary" id="btn-back">カテゴリ選択に戻る</button>
      </div>
    </section>
  </div>
</div>

<script>
  // 課題テキストに基づく出題データ（表示順は課題テキストの並び順を維持）
  const DATA = {
    "全身状態とバイタル": {
      emoji: "❤️",
      count: 4,
      postures: {
        "座位": ["体温", "呼吸", "橈骨動脈の触診（座位）", "触診法による上肢の血圧測定（座位）", "聴診法による上肢の血圧測定（座位）"],
        "仰臥位": ["橈骨動脈の触診（仰臥位）", "触診法による上肢の血圧測定（仰臥位）", "聴診法による上肢の血圧測定（仰臥位）", "足背動脈の触診", "後脛骨動脈の触診", "膝窩動脈の触診", "下腿・足背の浮腫"]
      }
    },
    "頭頸部": {
      emoji: "🧠", count: 5,
      items: ["頭", "眼", "耳", "鼻・副鼻腔", "口唇・口腔・咽頭", "唾液腺", "頭頸部リンパ節", "甲状腺"]
    },
    "胸部": {
      emoji: "🫁", count: 5,
      items: ["視診（頸部血管）", "聴診（頸部血管）", "触診（頸部血管）", "前胸部の視診", "視診（心臓）", "触診（心臓）", "聴診（心臓）", "視診（肺：前胸部）", "打診（肺：前胸部）", "聴診（肺：前胸部）", "背部の視診", "視診（肺：背部）", "打診（肺：背部）", "聴診（肺：背部）"]
    },
    "腹部": {
      emoji: "🫃", count: 5,
      items: ["視診", "腸蠕動音の聴診", "腹部の血管音の聴診", "腹部全体の打診", "肝臓の打診", "脾臓の打診", "浅い触診", "深い触診", "肝臓の触診", "脾臓の触診"]
    },
    "神経": {
      emoji: "⚡", count: 7,
      items: ["視野", "眼球運動・眼振", "瞼裂・瞳孔／対光反射", "顔面の感覚", "顔面筋", "軟口蓋・咽頭後壁の動き", "舌", "胸鎖乳突筋", "上半身の不随意運動", "Barré徴候（上肢）", "筋トーヌス（肘関節）", "鼻指鼻試験", "手回内・回外試験", "三角筋", "上腕二頭筋", "手根伸筋群（手関節の背屈）", "通常歩行", "つぎ足歩行", "Romberg試験", "踵膝試験", "腸腰筋", "前脛骨筋", "四肢の触覚と痛覚", "下顎反射", "上腕二頭筋反射", "上腕三頭筋反射", "膝蓋腱反射", "アキレス腱反射", "Babinski徴候（反射）", "項部硬直", "認知機能の診察"]
    }
  };

  const TIMER_DEFAULT = true; // タイマーの既定値（「本番想定」＝ON）

  const state = {
    cat: null,
    posture: null,
    items: [],
    count: 0,
    countPref: 0,   // 0 = 各カテゴリの既定値を使う
    timerPref: null, // null = TIMER_DEFAULT に従う
    sec: 0,
    running: false,
  };

  const $ = (id) => document.getElementById(id);

  function clamp(n) {
    return Number.isFinite(n) ? Math.max(1, Math.min(40, n)) : 0;
  }

  function timerEnabled() {
    return state.timerPref === null ? TIMER_DEFAULT : state.timerPref;
  }

  function categoryTotal(c) {
    return c.postures ? Object.values(c.postures).reduce((a, b) => a + b.length, 0) : c.items.length;
  }

  function pool(name) {
    const c = DATA[name];
    if (!c.postures) return { posture: null, pool: c.items };
    const keys = Object.keys(c.postures);
    const p = keys[Math.floor(Math.random() * keys.length)];
    return { posture: p, pool: c.postures[p] };
  }

  function pickRandomKeepOrder(arr, n) {
    const idx = arr.map((_, i) => i);
    for (let i = idx.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [idx[i], idx[j]] = [idx[j], idx[i]];
    }
    return idx.slice(0, n).sort((a, b) => a - b).map((i) => arr[i]);
  }

  function draw(name) {
    const { posture, pool: p } = pool(name);
    const n = Math.min(state.countPref || DATA[name].count, p.length);
    state.cat = name;
    state.posture = posture;
    state.items = pickRandomKeepOrder(p, n);
    state.count = n;
    state.sec = 0;
    state.running = timerEnabled();
    renderResult();
  }

  // ── 選択画面 ──────────────────────────────────────────
  function renderSelect() {
    $('count-input').value = state.countPref ? String(state.countPref) : '';
    $('btn-timer-on').classList.toggle('active', timerEnabled());
    $('btn-timer-off').classList.toggle('active', !timerEnabled());

    const grid = $('category-grid');
    grid.innerHTML = '';
    Object.keys(DATA).forEach((name, i) => {
      const c = DATA[name];
      const btn = document.createElement('button');
      btn.className = 'category-btn';
      btn.style.animationDelay = (i * 0.06) + 's';
      btn.innerHTML = `
        <span class="emoji">${c.emoji}</span>
        <span class="info">
          <span class="name">${name}</span>
          <span class="meta">推奨 ${c.count} 問 / 全 ${categoryTotal(c)} 項目</span>
        </span>`;
      btn.addEventListener('click', () => draw(name));
      grid.appendChild(btn);
    });
  }

  $('btn-dec').addEventListener('click', () => { state.countPref = clamp((state.countPref || 5) - 1); renderSelect(); });
  $('btn-inc').addEventListener('click', () => { state.countPref = clamp((state.countPref || 5) + 1); renderSelect(); });
  $('btn-reset-count').addEventListener('click', () => { state.countPref = 0; renderSelect(); });
  $('count-input').addEventListener('change', (e) => { state.countPref = clamp(parseInt(e.target.value, 10)); renderSelect(); });
  $('btn-timer-on').addEventListener('click', () => { state.timerPref = true; renderSelect(); });
  $('btn-timer-off').addEventListener('click', () => { state.timerPref = false; state.running = false; renderSelect(); });

  // ── 結果画面 ──────────────────────────────────────────
  function formatClock(sec) {
    return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
  }

  function renderResult() {
    $('result-header').innerHTML = `<span class="tag">${state.cat}</span>` +
      (state.posture ? `<span class="tag sub">${state.posture}</span>` : '') +
      `<span class="count-label">${state.count} 問</span>`;

    $('timer-card').classList.toggle('hidden', !timerEnabled());
    $('clock').textContent = formatClock(state.sec);
    $('btn-toggle-run').textContent = state.running ? '一時停止' : '開始';

    $('item-list').innerHTML = '';
    state.items.forEach((text, i) => {
      const li = document.createElement('li');
      li.style.animationDelay = (i * 0.07) + 's';
      li.innerHTML = `<span class="num">${i + 1}</span><span class="text">${text}</span>`;
      $('item-list').appendChild(li);
    });

    $('screen-select').classList.add('hidden');
    $('screen-result').classList.remove('hidden');
  }

  $('btn-redraw').addEventListener('click', () => draw(state.cat));
  $('btn-back').addEventListener('click', () => {
    state.cat = null;
    state.running = false;
    state.sec = 0;
    $('screen-result').classList.add('hidden');
    $('screen-select').classList.remove('hidden');
  });
  $('btn-toggle-run').addEventListener('click', () => {
    state.running = !state.running;
    $('btn-toggle-run').textContent = state.running ? '一時停止' : '開始';
  });
  $('btn-reset-clock').addEventListener('click', () => {
    state.sec = 0;
    $('clock').textContent = formatClock(state.sec);
  });

  setInterval(() => {
    if (state.running) {
      state.sec += 1;
      $('clock').textContent = formatClock(state.sec);
    }
  }, 1000);

  renderSelect();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
</script>
</body>
</html>
